    <script>
      // Catch and suppress empty or benign sandboxed iframe errors early before modules load
      window.addEventListener('error', function(e) {
        if (!e.message || e.message === 'Script error.' || e.message === 'Uncaught ' || e.message.trim() === 'Uncaught') {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (!e.reason || e.reason === '' || typeof e.reason === 'undefined') {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
        var msg = String((e.reason && e.reason.message) || e.reason || '');
        if (msg === 'Uncaught ' || msg === '' || msg.indexOf('NotAllowedError') !== -1 || msg.indexOf('clipboard') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
